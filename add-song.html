<!DOCTYPE html>
<html>

<body>

<h2>Add Song</h2>


<input id="title" placeholder="Title">

<input id="artist" placeholder="Artist">

<input id="slug" placeholder="Slug">

<input id="image" placeholder="Image URL">

<input id="audio" placeholder="Audio URL">


<select id="section">

<option>New Music</option>
<option>Trending Music</option>
<option>Albums</option>
<option>New Videos</option>
<option>Trending Videos</option>
<option>World Music</option>

</select>


<button id="save">
Upload
</button>


<script type="module">


import {supabase} from "../supabase.js";



save.onclick=async()=>{


await supabase

.from("songs")

.insert({

title:title.value,

artist:artist.value,

slug:slug.value,

image_url:image.value,

audio_url:audio.value,

section:section.value

});


alert("Song added");

location="admin.html";


};


</script>


</body>
</html>
