<!DOCTYPE html>
<html>

<body>

<h2>Edit Song</h2>


<input id="title">

<input id="artist">

<input id="image">

<input id="audio">


<button id="update">
Update
</button>



<script type="module">


import {supabase} from "../supabase.js";


let id =
new URLSearchParams(location.search)
.get("id");



let song;



async function load(){


let res=
await supabase
.from("songs")
.select("*")
.eq("id",id)
.single();


song=res.data;


title.value=song.title;

artist.value=song.artist;

image.value=song.image_url;

audio.value=song.audio_url;


}


load();



update.onclick=async()=>{


await supabase

.from("songs")

.update({

title:title.value,

artist:artist.value,

image_url:image.value,

audio_url:audio.value

})

.eq("id",id);



alert("Updated");


location="admin.html";


};



</script>


</body>
</html>
